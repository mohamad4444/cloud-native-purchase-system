
services:
  # Builder service 
  # this is important to build common libraries from /libraries/common and pom parent and base pom so that purchase and inventory services can run
  # builder-common:
  #   build:
  #     context: .
  #     dockerfile: docker/base-images/builder-common/Dockerfile
  #   image: localhost:5000/builder-common:latest
  #   container_name: builder-common
  #   profiles: ["build"]
  #   #application.resources reads environment variables
  #   environment:
  #     ARTEMIS_BROKER_URL: tcp://artemis:61616
  #     ARTEMIS_USER: artemis
  #     ARTEMIS_PASSWORD: artemis
  #     KEYCLOAK_ISSUER_URI: http://localhost:8280/auth/realms/purchase-service-realm
  #     KEYCLOAK_JWK_SET_URI: http://localhost:8280/auth/realms/purchase-service-realm/protocol/openid-connect/certs
  #     APP_QUEUE_NAME: purchase.events
  #     SPRING_SECURITY_LOG_LEVEL: INFO
  #   networks:
  #     - purchase-network

  # Frontend service
  nginx-frontend:
    build:
      context: services/web-client
      dockerfile: Dockerfile
    image: localhost:5000/web-client:latest
    container_name: purchasesystem-frontend
    ports:
      - "4200:80"
    networks:
      - purchase-network

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      #Database configs
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      #Master realm settings
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      #Keycloak expcts https since Keycloak 17+ , it can be disabled by these values
      KC_HTTP_ENABLED: "true" # not required when - start-dev command is used
      KC_HOSTNAME_STRICT_HTTPS: "false"
      #if adminconsole should be on a different domain
      #KC_HOSTNAME_ADMIN: 

      #Keycloak normally tries to infer hostname but if it is behind a proxy it fails
      #this value is important if using a reverse proxy
      #it is the site accisable publicly to the clients
      KC_HOSTNAME_URL: http://localhost:8280/auth
      #Reverse proxy settings
      #KC_PROXY_TRUSTED_ADDRESSES: 127.0.0.1,172.16.0.0/12
      #KC_PROXY_HEADERS: xforwarded
      #KC_HOSTNAME_STRICT: true
    ports:
      - "8080:8080"
    command:
      #HTTP enabled by default on port 8080
      # it also doesn't require you to use --http-enabled=true
      # - start (by default only HTTPS 8443)
      - start-dev

      # Commands below can be replaced with environment variables
      #- --http-enabled=true
      #- --hostname=https://auth.mycompany.com
      #- --proxy-headers=xforwarded
    depends_on:
      - keycloak-db
    networks:
      - purchase-network

  # API proxy
  api-proxy:
    image: nginx:latest
    container_name: api-proxy
    volumes:
      - ./docker/configs/api-proxy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8280:80"
    # depends_on:
      # - keycloak
      # - purchase-service
      # - inventory-service
    networks:
      - purchase-network

  # Keycloak database
  keycloak-db:
    image: postgres:17.5
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5432:5432"
    volumes:
      - ./docker/volumes/keycloak_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  #Purchase database
  purchase-db:
    image: postgres:17.5
    container_name: purchase-db
    environment:
      POSTGRES_DB: purchase_db
      POSTGRES_USER: purchase_user
      POSTGRES_PASSWORD: purchase_password
    ports:
      - "5433:5432"
    volumes:
      - ./docker/volumes/purchase_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  # Inventory database
  inventory-db:
    image: postgres:17.5
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5434:5432"
    volumes:
      - ./docker/volumes/inventory_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  # Artemis message broker
  artemis:
    build:
      context: .
      dockerfile: docker/services/artemis/Dockerfile
    image: localhost:5000/artemis:latest
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - ./docker/volumes/artemis-data:/var/lib/artemis-instance
    networks:
      - purchase-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61616"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Monitoring services
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - purchase-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./docker/volumes/grafana-data:/var/lib/grafana
    networks:
      - purchase-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "1000:1000" 
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/volumes/loki-data:/loki
      - ./docker/configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - purchase-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/configs/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - ./docker/volumes/promtail-positions:/promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - purchase-network

  # Inventory service
  inventory-service:
    build:
      context: services/inventory-service
      dockerfile: Dockerfile
    image: localhost:5000/inventory-service:latest
    container_name: inventory-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DATASOURCE_USERNAME: inventory_user
      DATASOURCE_PASSWORD: inventory_password
    depends_on:
      inventory-db:
        condition: service_started
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network

  # Purchase service
  purchase-service:
    build:
      context: services/purchase-service
      dockerfile: Dockerfile
    image: localhost:5000/purchase-service:latest
    container_name: purchase-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/purchase_db
      DATASOURCE_USERNAME: purchase_user
      DATASOURCE_PASSWORD: purchase_password
    depends_on:
      purchase-db:
        condition: service_started
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network

networks:
  purchase-network:
    driver: bridge

volumes:
  promtail-positions: