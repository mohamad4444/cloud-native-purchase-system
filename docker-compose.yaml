version: "3.8"

services:
  nginx-frontend:
    image: purchasesystem/frontend:latest
    container_name: purchasesystem-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - purchase-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME}          # e.g. localhost (no port)
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT}
      KC_PROXY: ${KC_PROXY}
      KEYCLOAK_FRONTEND_URL: "http://${KC_HOSTNAME}:${KEYCLOAK_PORT}"  # explicit full URL with port
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command:
      - start
    depends_on:
      - keycloak-db
    networks:
      - purchase-network
  keycloak-proxy:
      image: nginx:latest
      container_name: keycloak-proxy
      volumes:
        - ./docker/keycloak-proxy/keycloak-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      ports:
        - "8280:80" 
      depends_on:
        - keycloak
      networks:
        - purchase-network
  keycloak-db:
    image: postgres:17.5
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_KEYCLOAK}
      POSTGRES_USER: ${POSTGRES_USER_KEYCLOAK}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_KEYCLOAK}
    ports:
      - "${KEYCLOAK_DB_PORT}:5432"
    volumes:
      - ./docker/keycloak/keycloak_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  purchase-db:
    image: postgres:17.5
    container_name: purchase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PURCHASE}
      POSTGRES_USER: ${POSTGRES_USER_PURCHASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PURCHASE}
    ports:
      - "${PURCHASE_DB_PORT}:5432"
    volumes:
      - ./docker/purchase/purchase_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  inventory-db:
    image: postgres:17.5
    container_name: inventory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_INVENTORY}
      POSTGRES_USER: ${POSTGRES_USER_INVENTORY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_INVENTORY}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - ./docker/inventory/inventory_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  artemis:
    image: purchasesystem/artemis:latest
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: ${ANONYMOUS_LOGIN}
    ports:
      - "${ARTEMIS_CORE_PORT}:61616"
      - "${ARTEMIS_WEB_PORT}:8161"
    volumes:
      - ./docker/artemis/artemis-data:/var/lib/artemis-instance
    networks:
      - purchase-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61616"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - purchase-network
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./docker/grafana/grafana-data:/var/lib/grafana
    networks:
      - purchase-network
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - purchase-network
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./docker/promtail/logs:/var/log
      - ./docker/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - purchase-network
  inventory-service:
    build:
      context: ./services
      dockerfile: inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/${POSTGRES_DB_INVENTORY}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_INVENTORY}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_INVENTORY}
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT}
      ARTEMIS_BROKER_URL: tcp://localhost:61616
      # Add more env vars as needed
    depends_on:
      inventory-db:
        condition: service_started
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network

  purchase-service:
    build:
      context: ./services
      dockerfile: purchase-service/Dockerfile
    container_name: purchase-service
    ports:
      - "${PURCHASE_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/${POSTGRES_DB_PURCHASE}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_PURCHASE}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_PURCHASE}
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT}
      ARTEMIS_BROKER_URL: tcp://localhost:61616
      # Add more env vars as needed
    depends_on:
      inventory-db:
        condition: service_started
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network
    
networks:
  purchase-network:
    driver: bridge
