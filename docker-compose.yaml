x-common-vars: &common-vars
  ARTEMIS_BROKER_URL: tcp://artemis:61616
  ARTEMIS_USER: artemis
  ARTEMIS_PASSWORD: artemis
  KEYCLOAK_ISSUER_URI: http://localhost:8280/keycloak/realms/purchase-service-realm
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/keycloak/realms/purchase-service-realm/protocol/openid-connect/certs
  APP_QUEUE_NAME: purchase.events
  SPRING_SECURITY_LOG_LEVEL: DEBUG

services:

  # Frontend service
  nginx-frontend:
    build:
      context: services/web-client
      dockerfile: Dockerfile
    container_name: purchasesystem-frontend
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - purchase-network

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_PROXY_HEADERS: xforwarded
      PROXY_ADDRESS_FORWARDING: "true"
      KEYCLOAK_FRONTEND_URL: http://localhost:8280/keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_BACKCHANNEL: false
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY: edge
      KC_HEALTH_ENABLED: true
    ports:
      - "8080:8080"
      - "9000:9000"
    command:
      - start-dev
      - --http-relative-path=/keycloak
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    healthcheck:
      test: ["CMD", "curl", "--head",-fsS, "http://localhost:9000/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - purchase-network
    #8080 and 8443
  # API proxy
  api-proxy:
    image: nginx:latest
    container_name: api-proxy
    volumes:
      - ./docker/configs/api-proxy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8280:80"
    depends_on:
      - keycloak
      - inventory-service
      - purchase-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - purchase-network

  # Keycloak database
  keycloak-db:
    image: postgres:17.5
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5432:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Purchase database
  purchase-db:
    image: postgres:17.5
    container_name: purchase-db
    environment:
      POSTGRES_DB: purchase_db
      POSTGRES_USER: purchase_user
      POSTGRES_PASSWORD: purchase_password
    ports:
      - "5433:5432"
    volumes:
      - purchase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase_user -d purchase_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Inventory database
  inventory-db:
    image: postgres:17.5
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5434:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Artemis message broker
  artemis:
    build:
      context: docker/services/artemis
      dockerfile: Dockerfile
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - artemis_data:/var/lib/artemis-instance
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61616"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks:
      - purchase-network

  # Monitoring services
