x-common-vars: &common-vars
  ARTEMIS_BROKER_URL: tcp://artemis:61616
  ARTEMIS_USER: artemis
  ARTEMIS_PASSWORD: artemis
  KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/purchase-service-realm
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/purchase-service-realm/protocol/openid-connect/certs
  APP_QUEUE_NAME: purchase.events
  SPRING_SECURITY_LOG_LEVEL: DEBUG

services:

  # Frontend service
  nginx-frontend:
    image: localhost:5000/nginx-frontend:latest
    container_name: purchasesystem-frontend
    ports:
      - "4200:80"
    networks:
      - purchase-network

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_FRONTEND_URL: http://localhost:8280/keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
    ports:
      - "8080:8080"
      - "9000:9000"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./services/keycloak/realms:/opt/keycloak/data/import
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - purchase-network

  # Keycloak database
  keycloak-db:
    image: postgres:17.5
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    ports:
      - "5432:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Purchase database
  purchase-db:
    image: postgres:17.5
    container_name: purchase-db
    environment:
      POSTGRES_DB: purchase_db
      POSTGRES_USER: purchase_user
      POSTGRES_PASSWORD: purchase_password
    ports:
      - "5433:5432"
    volumes:
      - purchase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U purchase_user -d purchase_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Inventory database
  inventory-db:
    image: postgres:17.5
    container_name: inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
    ports:
      - "5434:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - purchase-network

  # Artemis message broker
  artemis:
    image: localhost:5000/artemis:latest
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis
      ANONYMOUS_LOGIN: "false"
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia"
    ports:
      - "61616:61616"
      - "8161:8161"
    volumes:
      - artemis_data:/var/lib/artemis-instance
    networks:
      - purchase-network

  # Inventory service
  inventory-service:
    image: localhost:5000/inventory-service:latest
    container_name: inventory-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DATASOURCE_USERNAME: inventory_user
      DATASOURCE_PASSWORD: inventory_password
      <<: *common-vars
    depends_on:
      inventory-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      artemis:
        condition: service_started
    networks:
      - purchase-network

  # Purchase service
  purchase-service:
    image: localhost:5000/purchase-service:latest
    container_name: purchase-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/purchase_db
      DATASOURCE_USERNAME: purchase_user
      DATASOURCE_PASSWORD: purchase_password
      <<: *common-vars
    depends_on:
      purchase-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      artemis:
        condition: service_started
    networks:
      - purchase-network
   
networks:
  purchase-network:
    driver: bridge

volumes:
  keycloak_db_data:
  purchase_db_data:
  inventory_db_data:
  artemis_data: