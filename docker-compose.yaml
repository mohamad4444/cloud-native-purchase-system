  #   ports:
  #     - "9090:9090"
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #   networks:
  #     - purchase-network

  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - GF_SECURITY_ADMIN_USER=admin
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:3000/api/health || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s
  #   networks:
  #     - purchase-network

  # loki:
  #   image: grafana/loki:latest
  #   container_name: loki
  #   ports:
  #     - "3100:3100"
  #   command: -config.file=/etc/loki/loki-config.yaml
  #   volumes:
  #     - loki_data:/loki
  #     - ./docker/configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
  #   healthcheck:
  #     test: wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q -w ready || exit 1
  #     start_period: 20s
  #     interval: 10s
  #     timeout: 1s
  #     retries: 12  # try for 2 minutes
  #   networks:
  #     - purchase-network

  # promtail:
  #   image: grafana/promtail:latest
  #   container_name: promtail
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./docker/configs/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
  #     - promtail_positions:/promtail
  #   command: -config.file=/etc/promtail/promtail-config.yaml
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9080/ready || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   depends_on:
  #     loki:
  #       condition: service_healthy
  #   networks:
  #     - purchase-network

  # Inventory service
  inventory-service:
    build:
      context: services/inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DATASOURCE_USERNAME: inventory_user
      DATASOURCE_PASSWORD: inventory_password
      <<: *common-vars
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      inventory-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network

  # Purchase service
  purchase-service:
    build:
      context: services/purchase-service
      dockerfile: Dockerfile
    container_name: purchase-service
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/purchase_db
      DATASOURCE_USERNAME: purchase_user
      DATASOURCE_PASSWORD: purchase_password
      <<: *common-vars
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      purchase-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      artemis:
        condition: service_healthy
    networks:
      - purchase-network

networks:
  purchase-network:
    driver: bridge

volumes:
  keycloak_db_data:
    driver: local
  purchase_db_data:
    driver: local
  inventory_db_data:
    driver: local
  artemis_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  promtail_positions:
    driver: local