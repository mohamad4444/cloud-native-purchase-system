services:
  # Builder service (not needed at runtime but included for completeness)
  builder-common:
    build:
      context: .
      dockerfile: docker/base-images/builder-common/Dockerfile
    image: ${REGISTRY}/builder-common:${TAG}
    container_name: builder-common
    profiles: ["build"]
    environment:
      ARTEMIS_BROKER_URL: ${ARTEMIS_BROKER_URL}
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      APP_QUEUE_NAME: ${PURCHASE_QUEUE_NAME}
      SPRING_SECURITY_LOG_LEVEL: ${SPRING_SECURITY_LOG_LEVEL}
    networks:
      - purchase-network

  # Frontend service
  nginx-frontend:
    build:
      context: services/web-client
      dockerfile: Dockerfile
    image: ${REGISTRY}/web-client:${TAG}
    container_name: purchasesystem-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - purchase-network

  # Keycloak identity provider
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: keycloak
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_PROXY_HEADERS: ${KC_PROXY_HEADERS}
      PROXY_ADDRESS_FORWARDING: "${PROXY_ADDRESS_FORWARDING}"
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT_BACKCHANNEL: ${KC_HOSTNAME_STRICT_BACKCHANNEL}
      KC_HTTP_RELATIVE_PATH: ${KC_HTTP_RELATIVE_PATH}
      KC_PROXY: ${KC_PROXY}
      KC_HTTP_ENABLED: "true"  # If using HTTP instead of HTTPS
      KC_HOSTNAME_STRICT: "false"  # Consider relaxing for development
      KC_HOSTNAME_STRICT_HTTPS: "false"  # Disable HTTPS strictness for dev
      KC_HOSTNAME_URL: http://localhost:8280  # Your actual access URL
      
      # CSP configuration to allow localhost
      KC_SPI_CSP_BUILDER_DEFAULT_POLICY: "frame-src 'self' http://localhost:8280; frame-ancestors 'self' http://localhost:8280; object-src 'none';"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    command:
      - start-dev
      - --http-relative-path=${KC_HTTP_RELATIVE_PATH}
      - --proxy-headers=${KC_PROXY_HEADERS}
      - --hostname-strict=${KC_HOSTNAME_STRICT}
    depends_on:
      - keycloak-db
    networks:
      - purchase-network

  # # API proxy
  # api-proxy:
  #   image: nginx:latest
  #   container_name: api-proxy
  #   volumes:
  #     - ./docker/configs/api-proxy/nginx-api.conf:/etc/nginx/conf.d/default.conf:ro
  #   ports:
  #     - "${API_PROXY_PORT}:80"
  #   depends_on:
  #     - keycloak
  #     - purchase-service
  #     - inventory-service
  #   networks:
  #     - purchase-network

  # Keycloak database
  keycloak-db:
    image: postgres:17.5
    container_name: keycloak-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_KEYCLOAK}
      POSTGRES_USER: ${POSTGRES_USER_KEYCLOAK}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_KEYCLOAK}
    ports:
      - "${KC_DB_PORT}:5432"
    volumes:
      - ./docker/volumes/keycloak_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  # Purchase database
  purchase-db:
    image: postgres:17.5
    container_name: purchase-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_PURCHASE}
      POSTGRES_USER: ${POSTGRES_USER_PURCHASE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PURCHASE}
    ports:
      - "${PURCHASE_DB_PORT}:5432"
    volumes:
      - ./docker/volumes/purchase_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  # Inventory database
  inventory-db:
    image: postgres:17.5
    container_name: inventory-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB_INVENTORY}
      POSTGRES_USER: ${POSTGRES_USER_INVENTORY}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_INVENTORY}
    ports:
      - "${INVENTORY_DB_PORT}:5432"
    volumes:
      - ./docker/volumes/inventory_db_data:/var/lib/postgresql/data
    networks:
      - purchase-network

  # Artemis message broker
  artemis:
    build:
      context: .
      dockerfile: docker/services/artemis/Dockerfile
    image: ${REGISTRY}/artemis:${TAG}
    container_name: artemis-broker
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: ${ANONYMOUS_LOGIN}
      EXTRA_ARGS: "--http-host 0.0.0.0 --relax-jolokia"
    ports:
      - "${ARTEMIS_CORE_PORT}:61616"
      - "${ARTEMIS_WEB_PORT}:8161"
    volumes:
      - ./docker/volumes/artemis-data:/var/lib/artemis-instance
    networks:
      - purchase-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61616"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Monitoring services
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - purchase-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./docker/volumes/grafana-data:/var/lib/grafana
    networks:
      - purchase-network

  loki:
    image: grafana/loki:latest
    container_name: loki
    user: "1000:1000" 
    ports:
      - "${LOKI_PORT}:3100"
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./docker/volumes/loki-data:/loki
      - ./docker/configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - purchase-network

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/configs/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml
      - ./docker/volumes/promtail-positions:/promtail
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki
    networks:
      - purchase-network

  # # Inventory service
  # inventory-service:
  #   build:
  #     context: services/inventory-service
  #     dockerfile: Dockerfile
  #   image: ${REGISTRY}/inventory-service:${TAG}
  #   container_name: inventory-service
  #   ports:
  #     - "${INVENTORY_SERVICE_PORT}:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE_INVENTORY}
  #     DATASOURCE_URL: ${DATASOURCE_URL_INVENTORY}
  #     DATASOURCE_USERNAME: ${POSTGRES_USER_INVENTORY}
  #     DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_INVENTORY}
  #   depends_on:
  #     inventory-db:
  #       condition: service_started
  #     keycloak:
  #       condition: service_started
  #     artemis:
  #       condition: service_healthy
  #   networks:
  #     - purchase-network

  # # Purchase service
  # purchase-service:
  #   build:
  #     context: services/purchase-service
  #     dockerfile: Dockerfile
  #   image: ${REGISTRY}/purchase-service:${TAG}
  #   container_name: purchase-service
  #   ports:
  #     - "${PURCHASE_SERVICE_PORT}:8080"
  #   environment:
  #     SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE_PROFILE}
  #     DATASOURCE_URL: ${DATASOURCE_URL_PURCHASE}
  #     DATASOURCE_USERNAME: ${POSTGRES_USER_PURCHASE}
  #     DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_PURCHASE}
  #   depends_on:
  #     purchase-db:
  #       condition: service_started
  #     keycloak:
  #       condition: service_started
  #     artemis:
  #       condition: service_healthy
  #   networks:
  #     - purchase-network

