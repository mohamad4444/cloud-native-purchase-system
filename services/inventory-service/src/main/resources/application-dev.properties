spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=5

# Queue name (must match producer's)
app.queue.name=my-queue



# Resource Server (validate incoming JWT tokens)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/your-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/your-realm/protocol/openid-connect/certs






# H2 Database Configuration
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.url=jdbc:h2:file:./data/mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console



spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5434/inventory
spring.datasource.username=inventory_user
spring.datasource.password=inventory_pass