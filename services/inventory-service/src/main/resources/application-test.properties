# Disable database initialization for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable JMS
spring.jms.listener.auto-startup=false
spring.artemis.embedded.enabled=false

# Disable Flyway
spring.flyway.enabled=false

# Disable JPA initialization
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# Use in-memory H2
spring.datasource.initialization-mode=never

# Mock security
spring.security.oauth2.resourceserver.jwt.issuer-uri=mock://test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=mock://test

# Reduce logging
logging.level.org.springframework=ERROR
logging.level.swtp.clouddemo=INFO