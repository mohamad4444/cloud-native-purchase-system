spring.application.name=${APP_NAME:inventory-service}
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=classpath:/application-common.properties

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5434/inventory}
spring.datasource.username=${DATASOURCE_USERNAME:inventory_user}
spring.datasource.password=${DATASOURCE_PASSWORD:inventory_pass}
spring.jms.template.default-destination=inventory.events