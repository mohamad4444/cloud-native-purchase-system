spring.mvc.hiddenmethod.filter.enabled=true
spring.http.converters.preferred-json-mapper=jackson

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator



# Explicitly enable the Prometheus endpoint

# Enable all metric collection
management.metrics.enable.all=true

logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# To use JSON logging compatible with Loki (optional, but recommended)
logging.file.name=app.log

# If you want to push logs to Loki directly, use Loki logback or log4j2 appenders (more complex)
spring.artemis.mode=native
spring.artemis.broker-url=tcp://artemis-broker:61616
spring.artemis.user=admin
spring.artemis.password=admin
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=5

spring.jms.pub-sub-domain=false

# Resource Server (validate incoming JWT tokens from clients)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/auth/realms/purchase-service-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/auth/realms/purchase-service-realm/protocol/openid-connect/certs

# Logging configuration
logging.level.org.springframework.security=trace


# Use file-based H2 database
#spring.datasource.url=jdbc:h2:file:./data/devdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
# Enable H2 console for browser access
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#or none

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Queue name (must match producer's)
app.queue.name=my-queue

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.driver-class-name=org.postgresql.Driver

