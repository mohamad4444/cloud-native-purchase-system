# ==============================
# Server and MVC Configuration
# ==============================
server.address=0.0.0.0
spring.mvc.hiddenmethod.filter.enabled=true
spring.http.converters.preferred-json-mapper=jackson

# ==============================
# Actuator and Monitoring (not Used in kubernetes, only docker-compsoe version)
# ==============================
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=${spring.application.name}

# ==============================
# Artemis / JMS Configuration
# ==============================
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=5
spring.jms.pub-sub-domain=false

# ==============================
# Keycloak / OAuth2 Configuration
# ==============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8280/keycloak/realms/purchase-service-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/keycloak/realms/purchase-service-realm/protocol/openid-connect/certs}

# ==============================
# JPA / Hibernate Configuration
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ==============================
# Flyway Configuration
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==============================
# Database Driver
# ==============================
spring.datasource.driver-class-name=org.postgresql.Driver
