spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=admin

spring.jms.template.default-destination=inventory.events
spring.jms.pub-sub-domain=false

# Resource Server (validate incoming JWT tokens from clients)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/purchase-service-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/purchase-service-realm/protocol/openid-connect/certs
# Logging configuration
logging.level.org.springframework.security=trace


# Use file-based H2 database
#spring.datasource.url=jdbc:h2:file:./data/devdb
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
# Enable H2 console for browser access
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#or none

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/purchase
spring.datasource.username=purchase_user
spring.datasource.password=purchase_pass
