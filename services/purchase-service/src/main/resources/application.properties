spring.application.name=${APP_NAME:purchase-service}
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=classpath:/application-common.properties

spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5433/purchase}
spring.datasource.username=${DATASOURCE_USERNAME:purchase_user}
spring.datasource.password=${DATASOURCE_PASSWORD:purchase_pass}
spring.jms.template.default-destination=${JMS_DESTINATION:inventory.events}