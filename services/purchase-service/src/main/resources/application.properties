spring.application.name=purchase-service
server.port=8080
spring.profiles.active=dev

spring.mvc.hiddenmethod.filter.enabled=true
spring.http.converters.preferred-json-mapper=jackson

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator



# Explicitly enable the Prometheus endpoint

# Enable all metric collection
management.metrics.enable.all=true


logging.level.root=INFO
logging.level.org.springframework.web=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# To use JSON logging compatible with Loki (optional, but recommended)
logging.file.name=app.log

# If you want to push logs to Loki directly, use Loki logback or log4j2 appenders (more complex)
