<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secure Purchase App</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="text/javascript" src="lib/keycloak.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
<div>
  <h1>Welcome to Purchase System haa</h1>

  <div>
    <div id="user-info"></div>
    <button id="loginBtn">Login</button>
    <button id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <div id="inventorySection" style="display:none;">
    <h2>Available Products</h2>
    <div id="inventoryList"></div>
    <button id="finalizePurchaseBtn">Finalize Purchase</button>
  </div>

  <hr />

  <div id="purchaseHistorySection" style="display:none;">
    <h2>Purchase History</h2>

    <div id="pendingPurchases">
      <h4>Pending</h4>
      <table>
        <thead><tr><th>Product</th><th>Quantity</th><th>Time</th></tr></thead>
        <tbody id="pendingTableBody"></tbody>
      </table>
    </div>

    <div id="completedPurchases">
      <h4>Completed</h4>
      <table>
        <thead><tr><th>Product</th><th>Quantity</th><th>Time</th></tr></thead>
        <tbody id="completedTableBody"></tbody>
      </table>
    </div>

    <div id="rejectedPurchases">
      <h4>Rejected</h4>
      <table>
        <thead><tr><th>Product</th><th>Quantity</th><th>Time</th><th>Reason</th></tr></thead>
        <tbody id="rejectedTableBody"></tbody>
      </table>
    </div>
  </div>
</div>


</body>
</html>
