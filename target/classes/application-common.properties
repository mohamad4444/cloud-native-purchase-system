# Server and MVC configuration
spring.mvc.hiddenmethod.filter.enabled=true
spring.http.converters.preferred-json-mapper=jackson
server.address=0.0.0.0

# Actuator and monitoring
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=${spring.application.name}

# Metric collection
management.metrics.enable.all=true

# Logging configuration
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=TRACE
logging.level.org.apache.http=DEBUG
logging.level.org.apache.http.wire=DEBUG
logging.level.org.springframework.security.oauth2=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=app.log

# Artemis/JMS configuration
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_BROKER_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:admin}
spring.jms.listener.min-concurrency=1
spring.jms.listener.max-concurrency=5
spring.jms.pub-sub-domain=false


# spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8280/auth/realms/purchase-service-realm
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/auth/realms/purchase-service-realm/protocol/openid-connect/certs
# Keycloak/OAuth2 configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8280/keycloak/realms/purchase-service-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/keycloak/realms/purchase-service-realm/protocol/openid-connect/certs}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

# Queue name
app.queue.name=${APP_QUEUE_NAME:my-queue}

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration/dev
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Database driver
spring.datasource.driver-class-name=org.postgresql.Driver