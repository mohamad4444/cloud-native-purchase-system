# Correct Loki configuration for current Helm chart
loki:
  commonConfig:
    replication_factor: 1
  storage:
    type: 'filesystem'
  auth_enabled: false

  # Config section must be under 'loki' now
  config: |
    auth_enabled: false
    common:
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    storage_config:
      boltdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/index_cache
        shared_store: filesystem
      filesystem:
        directory: /var/loki/chunks
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    chunk_store_config:
      max_look_back_period: 0s
    compactor:
      working_directory: /var/loki/compactor
      shared_store: filesystem

# Single binary mode for Minikube
singleBinary:
  enabled: true
  replicas: 1

# Persistence
persistence:
  enabled: true
  size: 5Gi
  storageClassName: standard

# Service
service:
  type: ClusterIP

# Gateway (simplified setup)
gateway:
  enabled: false # Disable gateway for simple setup

# Minikube resource limits
resources:
  limits:
    memory: "1Gi"
    cpu: "1000m"
  requests:
    memory: "512Mi"
    cpu: "500m"
