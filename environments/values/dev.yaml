# values/dev.yaml

# default chart values are always loaded first then they are loaded in this order
# defaults < globalBefore(overrides default) <releasSpecific (overrides globalBefore) <gloablAfter (overrides releaseSpecific)
# globalConfig is unrelated to overriding , it is a seperate namespace that serves as global values
globalConfig:
  # These are available as .Values.globalConfig.* - NO conflicts!
  registry:
    url: "registry.example.com"
    username: "admin"
    password: "secret123"
  api:
    endpoint: "https://api.dev.example.com"
    key: "dev-api-key-123"

globalBefore:
  # Low priority: can be overridden by anything
  logLevel: "info"
  monitoring: true
  replicaCount: 1
globalAfter:
  # High priority: overrides everything
  security:
    enabled: true
    scan: "daily"
  replicaCount: 5

frontend:
  # Release-specific values (medium priority)
  replicaCount: 612
  image:
    pullPolicy: Always

keycloak:
  # Release-specific values
  replicaCount: 999
  service:
    type: ClusterIP
