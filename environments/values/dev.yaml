# values/dev.yaml
globalConfig:
  # These are available as .Values.globalConfig.* - NO conflicts!
  registry:
    url: "registry.example.com"
    username: "admin"
    password: "secret123"
  api:
    endpoint: "https://api.dev.example.com"
    key: "dev-api-key-123"

globalBefore:
  # Low priority: can be overridden by anything
  logLevel: "info"
  monitoring: true
  replicaCount: 6
globalAfter:
  # High priority: overrides everything
  security:
    enabled: true
    scan: "daily"
  #replicaCount: 777

frontend:
  # Release-specific values (medium priority)
  #replicaCount: 612
  image:
    pullPolicy: Always

keycloak:
  # Release-specific values
  #replicaCount: 1
  service:
    type: ClusterIP
