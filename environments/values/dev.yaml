# values/dev.yaml

globalConfig:
  registry:
    url: "registry.example.com"
    username: "admin"
    password: "secret123"
  api:
    endpoint: "http://localhost:5000/api" # dev-local API
    key: "dev-api-key-123"

globalBefore:
  logLevel: "debug"
  monitoring: false
  replicaCount: 1

globalAfter:
  security:
    enabled: false
    scan: "none"
  replicaCount: 1

frontend:
  replicaCount: 1
  image:
    repository: localhost:5000/frontend
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  ingress:
    enabled: true
    host: localhost # plain localhost
  ingress2:
    enabled: false
  frontendUrl: http://localhost # dev frontend URL

keycloak:
  replicaCount: 1
  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.2.5
  adminUser: admin
  adminPassword: adminpassword
  httpRelativePath: /auth
  proxyMode: standalone
  proxyHeaders: xforwarded
  proxyAddressForwarding: false
  hostnameStrict: false
  frontendUrl: http://localhost/auth # Keycloak dev URL
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    host: localhost # plain localhost
    paths:
    - /auth
