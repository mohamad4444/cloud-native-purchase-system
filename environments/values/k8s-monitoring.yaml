# Grafana Alloy Kubernetes Monitoring configuration
cluster:
  name: minikube

destinations:
- name: loki
  type: loki
  url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

clusterEvents:
  enabled: true
  collector: alloy-logs
  namespaces:
  - monitoring
  - purchase-app # Changed from prod to purchase-app

nodeLogs:
  enabled: false

podLogs:
  enabled: true
  gatherMethod: kubernetesApi
  collector: alloy-logs
  labelsToKeep: [ "app_kubernetes_io_name", "container", "instance", "job", "level", "namespace", "service_name", "service_namespace", "deployment_environment", "deployment_environment_name" ]
  structuredMetadata:
    pod: pod
  namespaces:
  - monitoring
  - purchase-app # Changed from prod to purchase-app

alloy-singleton:
  enabled: false

alloy-metrics:
  enabled: false

alloy-logs:
  enabled: true
  alloy:
    mounts:
      varlog: false
    clustering:
      enabled: true

alloy-profiles:
  enabled: false

alloy-receiver:
  enabled: false
