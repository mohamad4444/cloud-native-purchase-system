# Grafana configuration
adminUser: admin
adminPassword: adminadminadmin

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false

persistence:
  enabled: true
  size: 10Gi
  storageClassName: standard

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Loki
      type: loki
      access: proxy
      orgId: 1
      url: http://loki-gateway.monitoring.svc.cluster.local:80
      basicAuth: false
      isDefault: false
      version: 1
      editable: false

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-logs:
      gnetId: 18283
      revision: 1
      datasource: Loki
