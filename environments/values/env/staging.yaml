# values/prod.yaml
globalConfig:
  namespace: "staging" #used to set namespace of all charts
  env: "staging" #used to set labels
  profile: "staging" #used in spring services
  registry: "localhost:5000/" #used to set registry of all charts
  pullPolicy: Always #used to set pullPolicy for all images in all charts, takes presedence over specific image pullPolicy
frontend:
  image:
    pullPolicy: IfNotPresent
  config:
    keycloak:
      url: "https://keycloak.local"
    api:
      purchases: "purchase-api/purchases"
      inventory: "inventory-api/inventory"
  ingress:
    enabled: true
keycloak:
  globalConfig:
    env: staging

  auth:
    configs:
      proxyAddressForwarding: true
      proxyMode: edge
      frontendUrl: https://keycloak.local

  ingress:
    enabled: true
    host: keycloak.local
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
