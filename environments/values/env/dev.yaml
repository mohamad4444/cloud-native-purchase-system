# values/prod.yaml
globalConfig:
  namespace: "dev"
  env: "dev"
  profile: "dev"
  registry: "localhost:5000/"
  pullPolicy: IfNotPresent

frontend:
  image:
    pullPolicy: IfNotPresent
  config:
    keycloak:
      url: "http://localhost:8080"
    api:
      purchases: "http://localhost:8001/purchases"
      inventory: "http://localhost:8002/inventory"
  ingress:
    enabled: false
keycloak:
  auth:
    configs:
      proxyAddressForwarding: false
      proxyMode: standalone
      frontendUrl: http://localhost:8080
  ingress:
    enabled: false
