globalConfig:
  namespace: "dev"
  env: "dev"
  profile: "dev"
  registry: "localhost:5000/"
  pullPolicy: IfNotPresent
frontend:
  image:
    pullPolicy: IfNotPresent
  config:
    keycloak:
      url: "http://localhost:8088"
    api:
      purchases: "http://localhost:8001/purchase-api/purchases"
      inventory: "http://localhost:8002/inventory-api/inventory"
  ingress:
    enabled: false
keycloak:
  auth:
    configs:
      proxyAddressForwarding: false
      proxyMode: standalone
      frontendUrl: http://localhost:8088
  ingress:
    enabled: false
inventory-service:
  keycloak:
    issuer: http://localhost:8088/realms/purchase-service-realm
purchase-service:
  keycloak:
    issuer: http://localhost:8088/realms/purchase-service-realm
