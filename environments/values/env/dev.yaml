globalConfig:
  namespace: "purchase-app"
  environment: "dev"

  image-registry: localhsot:5000
  image-pullPolicy: IfNotPresent

  keycloak:
    url: "http://localhost:8280/auth"
    realm: "purchase-service-realm"
    clientId: "frontend-app"
  api:
    purchases: "purchase-api/purchases"
    inventory: "inventory-api/inventory"

  caIssuerName: "my-ca-issuer"
  caIssuerKind: "ClusterIssuer"
  certificates:
    frontend:
      secretName: "frontend-tls"
      commonName: "frontend.local"
      dnsNames:
      - "frontend.local"

globalDefaults:
  logLevel: "debug"
  monitoring: false
  replicaCount: 1

globalOverrides:
  security:
    enabled: false
    scan: "none"
  replicaCount: 1

frontend:
  replicaCount: 2
  image:
    tag: "dev-frontend-latest"

keycloak:
  service:
    type: ClusterIP
