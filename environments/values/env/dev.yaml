globalConfig:
  namespace: "dev"
  env: "dev" #env
  profile: "dev" # Spring profile
  registry: "localhost:5000/"
  pullPolicy: IfNotPresent

frontend:
  image:
    pullPolicy: IfNotPresent
  config:
    keycloak:
      url: "https://keycloak.local"
    api:
      purchases: "purchase-api/purchases"
      inventory: "inventory-api/inventory"
keycloak:
  auth:
    configs:
      proxyAddressForwarding: false
      proxyMode: standalone
      frontendUrl: http://localhost:8080
  ingress:
    enabled: false
