services:
  nginx-frontend:
    build:
      context: ./services/web-client
      dockerfile: Dockerfile
    volumes:
      - ./services/web-client/web:/usr/share/nginx/html:ro
    networks:
      - purchase-network
  artemis:
    build:
      context: ./docker/artemis
    image: purchasesystem/artemis:latest
    networks:
      - purchase-network
  keycloak:
    command: start-dev
  inventory-service:
    image: inventory-service-image  # build this once locally or via docker-compose build
    container_name: inventory-service
    volumes:
      - ./services/inventory-service/target/inventory-service.jar:/app/app.jar
    ports:
      - "${INVENTORY_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/${POSTGRES_DB_INVENTORY}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_INVENTORY}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_INVENTORY}
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT}
      ARTEMIS_BROKER_URL: tcp://localhost:61616
    depends_on:
      - inventory-db
      - keycloak
      - artemis
    networks:
      - purchase-network
    command: ["java", "-jar", "/app/app.jar"]

  purchase-service:
    image: purchase-service-image  # build once or via docker-compose build
    container_name: purchase-service
    volumes:
      - ./services/purchase-service/target/purchase-service.jar:/app/app.jar
    ports:
      - "${PURCHASE_SERVICE_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://purchase-db:5432/${POSTGRES_DB_PURCHASE}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER_PURCHASE}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD_PURCHASE}
      KEYCLOAK_URL: http://localhost:${KEYCLOAK_PORT}
      ARTEMIS_BROKER_URL: tcp://localhost:61616
    depends_on:
      - purchase-db
      - keycloak
      - artemis
    networks:
      - purchase-network
    command: ["java", "-jar", "/app/app.jar"]
  # TODO: mount logs in dev for debugging
  # springboot-app:
  #   volumes:
  #     - ./logs:/logs
