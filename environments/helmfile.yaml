# helmfile.yaml
helmDefaults:
  timeout: 600
  wait: true
  atomic: true
  createNamespace: true
  force: false

# repositories:
# - name: bitnami
#   url: https://charts.bitnami.com/bitnami
repositories:
- name: gitlab
  url: https://charts.gitlab.io
---
environments:
  default:
    values:
    - values/default.yaml
  dev:
    kubeContext: minikube
    values:
    - values/dev.yaml
  prod:
    kubeContext: minikube
    values:
    - values/prod.yaml
---

releases:
- name: cert-manager
  namespace: cert-manager
  createNamespace: true
  version: v1.18.2
  chart: oci://quay.io/jetstack/charts/cert-manager
  verify: true
  keyring: ./cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg
  labels:
    tier: ready
  values:
  - crds:
      enabled: true

# Your CA setup resources
- name: ca-issuer
  namespace: cert-manager #probably extra as it is a cluster issuer
  chart: ../charts/ca-issuer
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner-sa
  namespace: gitlab-runner
  chart: ../charts/gitlab-runner-sa
  labels:
    tier: ready
- name: gitlab-runner
  namespace: gitlab-runner
  chart: gitlab/gitlab-runner
  version: 0.80.1 # matches latest in repo
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/runner.yaml

- name: registry
  chart: ../charts/registry-chart
  namespace: registry
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl # Add Go template for value merging

- name: frontend
  chart: ../charts/frontend-chart
  namespace: frontend
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl # Add Go template for value merging

