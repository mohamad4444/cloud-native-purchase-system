# helmfile.yaml
helmDefaults:
  timeout: 300
  wait: true
  atomic: false
  createNamespace: true
  force: false
repositories:
- name: gitlab
  url: https://charts.gitlab.io
- name: grafana
  url: https://grafana.github.io/helm-charts
---
environments:
  default:
    values:
    - values/default.yaml
  dev:
    kubeContext: minikube
    values:
    - values/dev.yaml
  prod:
    kubeContext: minikube
    values:
    - values/prod.yaml
---

releases:
- name: cert-manager
  namespace: cert-manager
  createNamespace: true
  version: v1.18.2
  chart: oci://quay.io/jetstack/charts/cert-manager
  verify: true
  keyring: ./cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg
  labels:
    tier: ready
  values:
  - crds:
      enabled: true

# Your CA setup resources
- name: ca-issuer
  namespace: cert-manager
  createNamespace: true
  chart: ../charts/ca-issuer
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner-sa
  namespace: gitlab-runner
  createNamespace: true
  chart: ../charts/gitlab-runner-sa
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner
  namespace: gitlab-runner
  chart: gitlab/gitlab-runner
  version: 0.80.1
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/runner.yaml
  needs:
  - cert-manager/cert-manager

- name: frontend
  chart: ../charts/frontend-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: keycloak
  chart: ../charts/keycloak-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: message-broker
  chart: ../charts/message-broker-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: inventory-service
  chart: ../charts/inventory-service-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: purchase-service
  chart: ../charts/purchase-service-chart
  namespace: purchase-app
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: loki
  namespace: monitoring
  chart: grafana/loki
  version: 6.40.0
  values:
  - ./values/loki-values.yaml

# Install Grafana
- name: grafana
  namespace: monitoring
  chart: grafana/grafana
  version: 9.4.5
  values:
  - ./values/grafana-values.yaml
  needs:
  - loki

# Install Grafana Alloy (K8s Monitoring)
- name: k8s-monitoring
  namespace: monitoring
  chart: grafana/k8s-monitoring
  version: 3.5.1
  values:
  - ./values/k8s-monitoring.yaml
  needs:
  - loki
  - grafana
