# helmfile.yaml
helmDefaults:
  timeout: 600
  wait: true
  atomic: true

# repositories:
# - name: bitnami
#   url: https://charts.bitnami.com/bitnami
---
environments:
  default:
    values:
    - values/default.yaml
  dev:
    kubeContext: minikube
    values:
    - values/dev.yaml
  prod:
    kubeContext: minikube
    values:
    - values/prod.yaml
---
releases:
- name: frontend
  chart: ../charts/frontend-chart
  namespace: frontend
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl # Add Go template for value merging

- name: keycloak
  chart: ../charts/keycloak-chart
  namespace: auth
  createNamespace: false
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl # Add Go template for value merging

