# helmfile.yaml
helmDefaults:
  timeout: 300
  wait: true
  atomic: false
  createNamespace: true
  force: false
---
repositories:
- name: gitlab
  url: https://charts.gitlab.io
- name: grafana
  url: https://grafana.github.io/helm-charts
---
environments:
  dev:
    kubeContext: minikube
    values:
    - values/env/dev.yaml
  staging:
    kubeContext: minikube
    values:
    - values/env/staging.yaml
---
releases:
- name: cert-manager
  namespace: cert-manager
  createNamespace: true
  version: v1.18.2
  chart: oci://quay.io/jetstack/charts/cert-manager
  verify: true
  keyring: ./cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg
  labels:
    tier: ready
  values:
  - crds:
      enabled: true

- name: ca-issuer
  namespace: cert-manager
  createNamespace: true
  chart: ../charts/ca-issuer
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner-sa
  namespace: gitlab-runner
  createNamespace: true
  chart: ../charts/gitlab-runner-sa
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner
  namespace: gitlab-runner
  chart: gitlab/gitlab-runner
  version: 0.80.1
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/charts/runner.yaml
  needs:
  - gitlab-runner-sa

- name: frontend
  chart: ../charts/frontend-chart
  namespace: '{{ .Environment.Values.globalConfig.namespace | default "dev" }}'
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: keycloak
  chart: ../charts/keycloak-chart
  namespace: '{{ .Environment.Values.globalConfig.namespace | default "dev" }}'
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: message-broker
  chart: ../charts/message-broker-chart
  namespace: '{{ .Environment.Values.globalConfig.namespace | default "dev" }}'
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: inventory-service
  chart: ../charts/inventory-service-chart
  namespace: '{{ .Environment.Values.globalConfig.namespace | default "dev" }}'
  createNamespace: true
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: monitoring-stack
  chart: ../charts/monitoring-stack-chart
  namespace: monitoring
  createNamespace: true
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

# - name: purchase-service
#   chart: ../charts/purchase-service-chart
#   namespace: dev
#   createNamespace: true
#   labels:
#     tier: dev-notready,prod-ready
#   values:
#   - values/env/env-magic.gotmpl
#   needs:
#   - cert-manager/cert-manager

- name: loki
  namespace: monitoring
  chart: grafana/loki
  values:
  - ./values/charts/loki-values.yml

- name: grafana
  namespace: monitoring
  chart: grafana/grafana
  values:
  - ./values/charts/grafana-values.yml

- name: alloy-logs
  namespace: monitoring
  chart: grafana/alloy
  values:
  - ./values/charts/alloy-values.yaml
  needs:
  - monitoring/monitoring-stack # contains 
