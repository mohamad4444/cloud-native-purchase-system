# helmfile.yaml
helmDefaults:
  timeout: 600
  wait: true
  atomic: true
  createNamespace: true
  force: false

# repositories:
# - name: bitnami
#   url: https://charts.bitnami.com/bitnami
repositories:
- name: gitlab
  url: https://charts.gitlab.io
---
environments:
  default:
    values:
    - values/default.yaml
  dev:
    kubeContext: minikube
    values:
    - values/dev.yaml
  prod:
    kubeContext: minikube
    values:
    - values/prod.yaml
---

releases:
- name: gitlab-runner-sa
  namespace: gitlab-runner
  chart: ../charts/gitlab-runner-sa
  labels:
    tier: ready
- name: gitlab-runner
  namespace: gitlab-runner
  chart: gitlab/gitlab-runner
  version: 0.80.1 # matches latest in repo
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/runner.yaml

- name: frontend
  chart: ../charts/frontend-chart
  namespace: frontend
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env-magic.gotmpl # Add Go template for value merging

