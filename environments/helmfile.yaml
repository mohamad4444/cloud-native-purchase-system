# helmfile.yaml
helmDefaults:
  timeout: 300
  wait: true
  atomic: false
  createNamespace: true
  force: false
repositories:
- name: gitlab
  url: https://charts.gitlab.io
- name: grafana
  url: https://grafana.github.io/helm-charts
---
environments:
  dev:
    kubeContext: minikube
    values:
    - values/env/env/dev.yaml
  prod:
    kubeContext: minikube
    values:
    - values/env/env/prod.yaml
---

releases:
- name: cert-manager
  namespace: cert-manager
  createNamespace: true
  version: v1.18.2
  chart: oci://quay.io/jetstack/charts/cert-manager
  verify: true
  keyring: ./cert-manager-keyring-2021-09-20-1020CF3C033D4F35BAE1C19E1226061C665DF13E.gpg
  labels:
    tier: ready
  values:
  - crds:
      enabled: true

# Your CA setup resources
- name: ca-issuer
  namespace: cert-manager
  createNamespace: true
  chart: ../charts/ca-issuer
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner-sa
  namespace: gitlab-runner
  createNamespace: true
  chart: ../charts/gitlab-runner-sa
  labels:
    tier: ready
  needs:
  - cert-manager/cert-manager

- name: gitlab-runner
  namespace: gitlab-runner
  chart: gitlab/gitlab-runner
  version: 0.80.1
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/charts/runner.yaml
  needs:
  - cert-manager/cert-manager

- name: frontend
  chart: ../charts/frontend-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: keycloak
  chart: ../charts/keycloak-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: message-broker
  chart: ../charts/message-broker-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: inventory-service
  chart: ../charts/inventory-service-chart
  namespace: purchase-app
  createNamespace: true
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

- name: purchase-service
  chart: ../charts/purchase-service-chart
  namespace: purchase-app
  labels:
    tier: dev-notready,prod-ready
  values:
  - values/env/env-magic.gotmpl
  needs:
  - cert-manager/cert-manager

