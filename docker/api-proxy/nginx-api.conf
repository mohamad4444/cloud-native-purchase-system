server {
    listen 80;
    server_name localhost;  # Change to your domain in production

    # Redirect /auth (no slash) to /auth/ (with slash)
    location = /auth {
        return 301 http://$host:8280/auth/;
    }

    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8280;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Prefix /auth;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http://keycloak:8080/auth/ /auth/;
    }

    # Define a named location to handle CORS preflight
    location @handle_cors {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:4200' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Purchases and Inventory API (with or without trailing slash)
    location ~ ^/(purchase|inventory)(/)? {
        resolver 127.0.0.11 ipv6=off;

        proxy_pass http://$1-service:8080$2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

#         add_header 'Access-Control-Allow-Origin' 'http://localhost:4200' always;
#         add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
#         add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;

#         if ($request_method = OPTIONS) {
#             return 204;
#         }
    }

}
