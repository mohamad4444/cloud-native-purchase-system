stages:
- test
- build
- deploy

# Simple test job to verify runner is working
test-runner:
  stage: test
  tags:
  - kubernetes
  script:
  - echo "Hello from Minikube runner"

# Build Docker images using buildx
build_image:
  stage: build
  tags:
  - kubernetes
  image: docker:28.4.0
  services:
  - name: docker:28.4.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "" # required for DinD
    DOCKER_HOST: tcp://docker:2375
  script:
  - echo "=== Docker Version ==="
  - docker version
  - echo "=== Docker Buildx Version ==="
  - docker buildx version
  - echo "=== Create and Bootstrap Buildx Builder ==="
  - docker buildx create --name builder --use --driver docker-container
  - docker buildx inspect --bootstrap
  - echo "=== Build Base Images ==="
  - docker buildx bake base-images --push
  - echo "=== Build Application Images ==="
  - docker buildx bake application-images --push
  - echo "=== Build Completed ==="

# Deploy with Helmfile
deploy_helm:
  stage: deploy
  tags:
  - kubernetes
  image: lachlanevenson/k8s-helm:latest
  script:
  - echo "=== Helm Version ==="
  - helm version
  - echo "=== Helmfile Version ==="
  - helmfile --version
  - echo "=== Syncing Helmfile ==="
  - helmfile --file ./environments sync
  - echo "=== Deploy Completed ==="
