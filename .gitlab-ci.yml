stages:
- test
- build
- deploy

test-runner:
  stage: test
  tags:
  - kubernetes
  script:
  - echo "Hello from Minikube runner"

# Build Docker images using buildx
build_image:
  stage: build
  tags:
  - kubernetes
  script:
  - dockerd-entrypoint.sh & # start Docker daemon
  - sleep 30 # wait for it to be ready

  - docker buildx create --name mybuilder --driver docker-container --driver-opt network=host --use --buildkitd-config /etc/buildkitd.toml

  # # Enable insecure registry via environment variable
  - export DOCKER_CLI_EXPERIMENTAL=enabled
  - export DOCKER_BUILDKIT=1
  - unset DOCKER_HOST
  - echo "Using cluster-local registry"
  - NEW_REGISTRY="registry.kube-system.svc.cluster.local:80/"
  - sed -i "/variable \"REGISTRY\"/,/}/ s|default = \".*\"|default = \"$NEW_REGISTRY\"|" docker-bake.hcl
  - docker buildx bake base-images --push
  - docker buildx bake application-images --push

# Deploy with Helmfile
deploy_helm:
  stage: deploy
  tags:
  - kubernetes
  script:
  - echo "=== Helm Version ==="
  - helm version
  - echo "=== Helmfile Version ==="
  - helmfile --version
  - echo "=== Syncing Helmfile ==="
  - helmfile --file ./environments sync
  - echo "=== Deploy Completed ==="
