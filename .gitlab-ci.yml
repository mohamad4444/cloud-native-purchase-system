stages:
- test
- build
test-runner:
  stage: test
  tags:
  - kubernetes
  script:
  - echo "Hello from Minikube runner"
build_image:
  stage: build
  image: docker:24
  services:
  - docker:24-dind
  script:
  - docker buildx create --use builder-common
  - docker buildx bake base-images --push
  - docker buildx bake application-images --push

deploy_helm:
  stage: deploy
  image: lachlanevenson/k8s-helm:latest
  script:
  - helmfile --file ./environments sync
