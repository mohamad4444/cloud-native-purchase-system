dashboard:
  enabled: true
  host: dashboard.com
  namespace: kubernetes-dashboard

services:
  keycloak:
    name: keycloak
    port: 8080
  purchase:
    name: purchase-service
    port: 8080
  inventory:
    name: inventory-service
    port: 8080

nginxIngress:
  class: nginx
  rewriteTarget: /$2
  cors:
    enabled: true
    allowOrigin: "http://localhost:4200"
    allowMethods: "GET, POST, OPTIONS, PUT, DELETE"
    allowHeaders: "Authorization, Content-Type, X-Requested-With"
    allowCredentials: "true"

postgres:
  enabled: true
  namespace: dev-db
  name: postgres
  image: postgres:16
  port: 5432
  database: mydb
  username: user
  password: password
  storage:
    enabled: true
    size: 1Gi
