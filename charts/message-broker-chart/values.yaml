globalConfig:
  env: dev
  registry: "localhost:5000"
  pullPolicy: IfNotPresent

artemis:
  replicas: 1
  image:
    name: "artemis"
    tag: latest
    pullPolicy: IfNotPresent
  ports:
    core: 61616
    web: 8161
  service:
    type: ClusterIP
    ports:
    - name: core
      port: 61616
      targetPort: 61616
    - name: web
      port: 8161
      targetPort: 8161
  security:
    username: artemis
    password: artemis
    existingConfigMap: false
    existingSecret: false
    anonymousLogin: "false"
  storage:
    enabled: true
    size: 1Gi
    accessModes: [ "ReadWriteOnce" ]
    storageClass: ""
    mountPath: /var/lib/artemis-instance
  livenessProbe:
    enabled: true
    port: 61616
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
