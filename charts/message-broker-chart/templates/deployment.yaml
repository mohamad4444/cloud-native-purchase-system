apiVersion: apps/v1
kind: Deployment
metadata:
  name: artemis-broker
  namespace: {{ .Values.globalConfig.namespace }}
  labels:
    microserviceName: artemis
    component: broker
    env: {{ .Values.globalConfig.env }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.artemis.replicas }}
  selector:
    matchLabels:
      microserviceName: artemis
      component: broker
      env: {{ .Values.globalConfig.env }}
  template:
    metadata:
      labels:
        microserviceName: artemis
        component: broker
        env: {{ .Values.globalConfig.env }}
    spec:
      containers:
        - name: artemis
          image: "{{ .Values.globalConfig.registry }}{{ .Values.artemis.image.name }}:{{ .Values.artemis.image.tag }}"
          imagePullPolicy: {{ default .Values.artemis.image.pullPolicy .Values.globalConfig.pullPolicy }}
          env:
            - name: ARTEMIS_USER
              valueFrom:
                secretKeyRef:
                  name: artemis-secret
                  key: username
            - name: ARTEMIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: artemis-secret
                  key: password
            - name: ANONYMOUS_LOGIN
              valueFrom:
                configMapKeyRef:
                  name: artemis-config
                  key: anonymous-login
          ports:
            - containerPort: {{ .Values.artemis.ports.core }}
            - containerPort: {{ .Values.artemis.ports.web }}
          {{- if .Values.artemis.storage.enabled }}
          volumeMounts:
            - name: artemis-data
              mountPath: {{ .Values.artemis.storage.mountPath }}
          {{- end }}
          {{- if .Values.artemis.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.artemis.livenessProbe.port }}
            initialDelaySeconds: {{ .Values.artemis.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.artemis.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.artemis.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.artemis.livenessProbe.failureThreshold }}
          {{- end }}
      {{- if .Values.artemis.storage.enabled }}
      volumes:
        - name: artemis-data
          persistentVolumeClaim:
            claimName: artemis-pvc
      {{- end }}
