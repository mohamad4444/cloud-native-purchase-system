apiVersion: v1
kind: Service
metadata:
  name: artemis-service
  namespace: {{ .Values.globalConfig.env }}
  labels:
    app: artemis
    component: broker
    env: {{ .Values.globalConfig.env }}
spec:
  type: {{ .Values.artemis.service.type }}
  selector:
    app: artemis
    component: broker
    env: {{ .Values.globalConfig.env }}
  ports:
    {{- range .Values.artemis.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
    {{- end }}
