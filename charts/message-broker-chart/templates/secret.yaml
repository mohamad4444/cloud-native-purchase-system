{{- if not .Values.artemis.security.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: artemis-secret
  namespace: {{ .Values.globalConfig.env }}
  labels:
    app: artemis
    component: broker
    env: {{ .Values.globalConfig.env }}
type: Opaque
stringData:
  username: {{ .Values.artemis.security.username }}
  password: {{ .Values.artemis.security.password }}
{{- end }}
