{{- if not .Values.artemis.security.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: artemis-config
  namespace: {{ .Values.globalConfig.env }}
  labels:
    microserviceName: artemis
    component: broker
    env: {{ .Values.globalConfig.env }}
data:
  anonymous-login: {{ .Values.artemis.security.anonymousLogin | quote }}
{{- end }}
