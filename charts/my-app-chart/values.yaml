# values.yaml

# -- Number of replicas
replicaCount: 2

# -- Docker image details
image:
  repository: registry.gitlab.com/your-group/your-project # e.g., from GitLab Container Registry
  tag: latest # This will be overridden by the CI pipeline
  pullPolicy: IfNotPresent

# -- Application name
nameOverride: ""
fullnameOverride: ""

# -- Service configuration
service:
  type: ClusterIP
  port: 80

# -- Ingress configuration (enable if you need external access)
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

  # -- Resource requests and limits
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# -- Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
