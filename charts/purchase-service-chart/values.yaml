# Inherit from globalConfig or define locally if not available
globalConfig:
  env: "dev"
  registry: "localhost:5000"
  imagePullPolicy: IfNotPresent
# Application-specific configuration
backend:
  image:
    name: "purchase-service"
    tag: latest
    pullPolicy: IfNotPresent

database:
  name: purchasedb
  user: purchaseuser
  password: purchasepass
  port: 5432
  image: "postgres:17.5"
  storage: 1Gi

keycloak:
  service: keycloak-service
  realm: "purchase-service-realm"
  issuer: https://keycloak.local/realms/purchase-service-realm

artemis:
  user: artemis
  password: artemis
  service: artemis-service
  port: 61616
