apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase
  namespace: {{.Values.globalConfig.env}}
spec:
  replicas: 1
  selector:
    matchLabels:
      microserviceName: purchase
      component: backend
      env: {{.Values.globalConfig.env}}
  template:
    metadata:
      labels:
        microserviceName: purchase
        component: backend
        env: {{.Values.globalConfig.env}}
    spec:
      containers:
        - name: purchase
          image: "{{ .Values.globalConfig.registry }}{{ .Values.backend.image.name }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ default .Values.backend.image.pullPolicy .Values.globalConfig.pullPolicy }} 
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: purchase-config
            - secretRef:
                name: purchase-secret
---
apiVersion: v1
kind: Service
metadata:
  name: purchase-service
  namespace: {{.Values.globalConfig.env}}
spec:
  selector:
    microserviceName: purchase
    component: backend
    env: {{.Values.globalConfig.env}}
  ports:
    - port: 8080
      targetPort: 8080
