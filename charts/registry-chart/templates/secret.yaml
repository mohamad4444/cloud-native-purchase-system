apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.fullname" . }}-secret
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
data:
  http-secret: {{ randAlphaNum 16 | b64enc | quote }}
---
{{- if .Values.auth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.fullname" . }}-auth
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
data:
  htpasswd: {{ .Values.auth.htpasswd | b64enc | quote }}
{{- end }}