apiVersion: v1
kind: Service
metadata:
  name: keycloak-service
  namespace: {{ .Values.globalConfig.namespace }}
spec:
  type: {{ .Values.auth.service.type }}
  selector:
    microserviceName: keycloak
    component: auth
    env: {{ .Values.globalConfig.env }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: {{ .Values.auth.service.targetPort }}
