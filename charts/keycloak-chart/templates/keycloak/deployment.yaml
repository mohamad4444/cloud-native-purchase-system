apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: {{ .Values.globalConfig.namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      microserviceName: keycloak
      component: auth
      env: {{ .Values.globalConfig.env }}
  template:
    metadata:
      labels:
        microserviceName: keycloak
        component: auth
        env: {{ .Values.globalConfig.env }}
    spec:
      containers:
        - name: keycloak
          image: "{{ .Values.globalConfig.registry }}{{ .Values.auth.image.name }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ default .Values.auth.image.pullPolicy .Values.globalConfig.pullPolicy }}
          args:
            {{ include "keycloak.startArgs" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: keycloak-config
          env:
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-secret
                  key: POSTGRES_PASSWORD
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
          ports:
            - containerPort: {{ .Values.auth.service.port }}
