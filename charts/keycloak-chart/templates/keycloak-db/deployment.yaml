apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-db
  namespace: {{ .Values.globalConfig.namespace }}
spec:
  replicas: {{ .Values.database.replicaCount }}
  selector:
    matchLabels:
      microserviceName: keycloak
      component: database
      env: {{ .Values.globalConfig.env }}
  template:
    metadata:
      labels:
        microserviceName: keycloak
        component: database
        env: {{ .Values.globalConfig.env }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: {{ .Values.database.port }}
          envFrom:
            - secretRef:
                name: keycloak-db-secret
          volumeMounts:
            - name: keycloak-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: keycloak-db-data
          persistentVolumeClaim:
            claimName: keycloak-db-pvc
