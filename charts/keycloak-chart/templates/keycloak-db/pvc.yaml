apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-db-pvc
  namespace: {{ .Values.globalConfig.env }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.database.storageClass }}
  storageClassName: {{ .Values.database.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.storage }}
