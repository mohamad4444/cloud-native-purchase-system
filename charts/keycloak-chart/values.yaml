globalConfig:
  env: dev
  registry: "localhost:5000/"
  pullPolicy: IfNotPresent

auth:
  replicaCount: 1
  image:
    name: "keycloak"
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  configs:
    # Non-sensitive envs
    httpRelativePath: /
    proxyHeaders: xforwarded
    hostnameStrict: false
    proxyAddressForwarding: false
    proxyMode: standalone
    frontendUrl: http://localhost:8080
    httpEnabled: true
  admin:
    # Sensitive envs
    username: admin
    password: adminpassword

database:
  replicaCount: 1
  name: keycloakdb
  user: keycloak
  password: keycloakpassword
  port: 5432
  image: "postgres:17.5"
  storage: 1Gi
  storageClass: ""

ingress:
  enabled: false
  host: keycloak.local
  paths:
  - /
  annotations: {}
