# Global settings
namespace: auth

# Database settings
postgres:
  image: postgres:17.5
  dbName: keycloakdb
  username: keycloak
  password: keycloakpassword
  storage: 1Gi
  storageClass: ""

# Keycloak settings
keycloak:
  image: quay.io/keycloak/keycloak:26.2.5
  adminUser: admin
  adminPassword: adminpassword
  httpRelativePath: /auth
  proxyHeaders: xforwarded
  hostnameStrict: false
  proxyAddressForwarding: false
  proxyMode: standalone #edge
  frontendUrl: http://keycloak.localhost/auth
  # Service settings
  service:
    type: ClusterIP # Internal service
    port: 8080 # Container port for Keycloak
    nodePort: 32080 # Optional for dev if NodePort is needed

# Ingress settings
ingress:
  enabled: true
  host: keycloak.home
  paths:
  - /auth

# Deployment settings
replicaCount: 1
