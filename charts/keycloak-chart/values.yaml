namespace: purchase-app
appName: keycloak # microservice name and deployment name

backend:
  componentName: keycloak
  replicaCount: 1
  image:
    name: "localhost:5000/keycloak" # Image name
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP # Internal service (let ingress expose it)
    port: 8080
    targetPort: 8080

database:
  componentName: db
  name: keycloakdb
  user: keycloak
  password: keycloakpassword
  port: 5432
  image: "postgres:17.5"
  storage: 1Gi
  storageClass: ""

keycloak:
  adminUser: admin
  adminPassword: adminpassword
  httpRelativePath: /
  proxyHeaders: xforwarded
  hostnameStrict: false
  proxyAddressForwarding: true # required for ingress
  proxyMode: edge # edge/reencrypt recommended behind ingress
  frontendUrl: https://keycloak.local # update from localhost

ingress:
  enabled: true
  host: keycloak.local
  paths:
  - /
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false" # keep HTTP for now
