# Global values
global:
  namespace: default

# Database configuration
database:
  name: inventorydb
  user: inventoryuser
  password: inventorypassword
  port: 5432
  image:
    repository: postgres
    tag: 17.5
    pullPolicy: IfNotPresent
  storage:
    size: 1Gi
    accessModes: [ "ReadWriteOnce" ]
    storageClass: ""
  service:
    type: NodePort # Use ClusterIP for production
    nodePort: 30432
  bootstrap:
    enabled: true
    image:
      repository: postgres
      tag: 17.5
      pullPolicy: IfNotPresent

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"
