apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: {{.Values.globalConfig.env }}
data:
  APP_NAME: "inventory"
  SERVER_PORT: "8080"

  DATASOURCE_URL: "jdbc:postgresql://inventory-db-service:{{ .Values.database.port }}/{{ .Values.database.name }}"
  DATASOURCE_USERNAME: "{{ .Values.database.user }}"

  ARTEMIS_BROKER_URL: "tcp://{{ .Values.artemis.service }}:{{ .Values.artemis.port }}"
  ARTEMIS_USER: "{{ .Values.artemis.user }}"

  KEYCLOAK_ISSUER_URI: "{{.Values.keycloak.issuer}}"
  KEYCLOAK_JWK_SET_URI: "http://{{ .Values.keycloak.service }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs"
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secret
  namespace: {{.Values.globalConfig.env}}
type: Opaque
data:
  DATASOURCE_PASSWORD: {{ .Values.database.password | b64enc | quote }}
  ARTEMIS_PASSWORD: {{ .Values.artemis.password | b64enc | quote }}
