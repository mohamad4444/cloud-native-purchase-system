apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName}}-config
  namespace: {{ .Values.namespace }}
data:
  APP_NAME: "{{ .Values.appName }}"
  SERVER_PORT: "{{ .Values.backend.service.targetPort }}"

  DATASOURCE_URL: "jdbc:postgresql://{{.Values.appName}}-db:{{ .Values.database.port }}/{{ .Values.database.name }}"
  DATASOURCE_USERNAME: "{{ .Values.database.user }}"

  ARTEMIS_BROKER_URL: "tcp://{{ .Values.artemis.service }}"
  ARTEMIS_USER: "{{ .Values.artemis.user }}"

  KEYCLOAK_ISSUER_URI: "{{.Values.keycloak.issuer}}"
  KEYCLOAK_JWK_SET_URI: "http://{{ .Values.keycloak.service }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/certs"
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.appName}}-secret
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
data:
  DATASOURCE_PASSWORD: {{ .Values.database.password | b64enc | quote }}
  ARTEMIS_PASSWORD: {{ .Values.artemis.password | b64enc | quote }}
