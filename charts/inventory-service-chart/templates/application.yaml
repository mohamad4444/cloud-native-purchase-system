apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.appName}}
      component: {{.Values.backend.componentName}}
      env: {{.Values.globalConfig.env}}
  template:
    metadata:
      labels:
        app: {{.Values.appName}}
        component: {{.Values.backend.componentName}}
        env: {{.Values.globalConfig.env}}
    spec:
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.globalConfig.registry}}{{.Values.frontend.image.name}}:{{ .Values.frontend.image.tag }}" 
          imagePullPolicy: {{ default .Values.frontend.image.pullPolicy .Values.globalConfig.pullPolicy }} 
          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}
          envFrom:
            - configMapRef:
                name: {{.Values.appName}}-config
            - secretRef:
                name: {{.Values.appName}}-secret
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.appName}}-service
  namespace: {{.Values.namespace}}
spec:
  selector:
    app: {{.Values.appName}}
    component: {{.Values.backend.componentName}}
    env: {{.Values.globalConfig.env}}
  ports:
    - port: {{ .Values.backend.service.port  }}
      targetPort: {{ .Values.backend.service.targetPort  }}
