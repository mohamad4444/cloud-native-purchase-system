apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: {{.Values.globalConfig.env}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
      component: db
      env: {{.Values.globalConfig.env}}
  template:
    metadata:
      labels:
        app: inventory
        component: db
        env: {{.Values.globalConfig.env}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.database.name }}"
            - name: POSTGRES_USER
              value: "{{ .Values.database.user }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: inventory-secret
                  key: DATASOURCE_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: inventory-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db-service
  namespace: {{.Values.globalConfig.env}}
spec:
  selector:
    app: inventory
    component: db
    env: {{.Values.globalConfig.env}}
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-db-pvc
  namespace: {{.Values.globalConfig.env}}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}