apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}-{{ .Values.database.componentName }}
  namespace: {{ .Values.namespace}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{.Values.appName}}
      component: {{.Values.database.componentName}}
      env: {{.Values.globalConfig.env}}
  template:
    metadata:
      labels:
        app: {{.Values.appName}}
        component: {{.Values.database.componentName}}
        env: {{.Values.globalConfig.env}}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.image }}
          ports:
            - containerPort: {{ .Values.database.port }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.database.name }}"
            - name: POSTGRES_USER
              value: "{{ .Values.database.user }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{.Values.appName}}-secret
                  key: DATASOURCE_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{.Values.appName}}-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{.Values.appName}}-db
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{.Values.appName}}
    component: {{.Values.database.componentName}}
    env: {{.Values.globalConfig.env}}
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{.Values.appName}}-pvc
  namespace: purchase-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.database.storage }}