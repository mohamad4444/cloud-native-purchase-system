apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "inventory-db.labels" . | nindent 4 }}
spec:
  type: {{ .Values.database.service.type }}
  selector:
    {{- include "inventory-db.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.database.port }}
      targetPort: {{ .Values.database.port }}
      {{- if and (eq .Values.database.service.type "NodePort") .Values.database.service.nodePort }}
      nodePort: {{ .Values.database.service.nodePort }}
      {{- end }}