# pvc.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artemis-data-pvc
  namespace: messaging
  labels:
    app: artemis
    storage: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
