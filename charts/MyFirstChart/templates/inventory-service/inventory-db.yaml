# Inventory Database - Full Setup
---
apiVersion: v1
kind: Secret
metadata:
  name: inventory-db-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: inventorydb
  POSTGRES_USER: inventoryuser
  POSTGRES_PASSWORD: inventorypassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
    spec:
      containers:
        - name: inventory-db
          image: postgres:17.5
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: inventory-db-secret
          volumeMounts:
            - name: inventory-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: inventory-db-data
          persistentVolumeClaim:
            claimName: inventory-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-db
  namespace: default
spec:
  type: NodePort # use ClusterIP in production
  selector:
    app: inventory-db
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432 # only for local dev
---
apiVersion: batch/v1
kind: Job
metadata:
  name: inventory-db-bootstrap
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: psql
          image: postgres:17.5
          envFrom:
            - secretRef:
                name: inventory-db-secret
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h inventory-db -U postgres; do
                echo "Waiting for Postgres..."
                sleep 2
              done
              psql -h inventory-db -U postgres -c "DO
              $do$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '$POSTGRES_USER') THEN
                  CREATE USER $POSTGRES_USER WITH PASSWORD '$POSTGRES_PASSWORD';
                END IF;
                IF NOT EXISTS (SELECT FROM pg_database WHERE datname = '$POSTGRES_DB') THEN
                  CREATE DATABASE $POSTGRES_DB OWNER $POSTGRES_USER;
                END IF;
              END
              $do$;"
      restartPolicy: OnFailure
