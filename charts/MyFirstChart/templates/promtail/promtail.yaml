# promtail-daemonset.yaml  (Note: Using DaemonSet instead of Deployment)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      containers:
      - name: promtail
        image: grafana/promtail:latest
        args: ["-config.file=/etc/promtail/promtail-config.yaml"]
        volumeMounts:
        - name: config-volume
          mountPath: /etc/promtail/promtail-config.yaml
          subPath: promtail-config.yaml
        - name: positions-volume
          mountPath: /promtail
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: config-volume
        configMap:
          name: promtail-config
      - name: positions-volume
        persistentVolumeClaim:
          claimName: promtail-pvc
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: File