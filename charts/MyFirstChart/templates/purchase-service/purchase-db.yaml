# Purchase Database
---
apiVersion: v1
kind: Secret
metadata:
  name: purchase-db-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_DB: purchasedb
  POSTGRES_USER: purchaseuser
  POSTGRES_PASSWORD: purchasepassword
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: purchase-db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: purchase-db
  template:
    metadata:
      labels:
        app: purchase-db
    spec:
      containers:
        - name: purchase-db
          image: postgres:17.5
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: purchase-db-secret
          volumeMounts:
            - name: purchase-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: purchase-db-data
          persistentVolumeClaim:
            claimName: purchase-db-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: purchase-db-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: purchase-db
  namespace: default
spec:
  type: NodePort
  selector:
    app: purchase-db
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30433
