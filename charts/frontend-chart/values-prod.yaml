environment: "prod"
tls:
  enabled: true
  secretName: "frontend-tls-prod"

ingress:
  enabled: true
  className: "nginx"
  hosts:
  - host: "frontend.example.com"
    paths:
    - path: "/"
      pathType: "Prefix"
  tls:
  - hosts:
    - "frontend.example.com"
    secretName: "frontend-tls-prod"

keycloak:
  url: "https://auth.example.com/auth"

api:
  purchases: "https://api.example.com/purchase-service/purchases"
  inventory: "https://api.example.com/inventory-service/inventory"
