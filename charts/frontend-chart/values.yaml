replicaCount: 1
environment: "development" # Added

image:
  repository: localhost:5000/web-client
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

serviceAccount:
  create: true

ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts: []
  tls: []
  host: frontend.com

keycloak:
  url: "http://localhost:8080/auth"
  realm: "purchase-service-realm"
  clientId: "web-frontend-client"

api:
  purchases: "http://api.local.test/purchase-service/purchases"
  inventory: "http://api.local.test/inventory-service/inventory"

# Optional: if you want to keep the foo environment variable
foo: "default-value"
