# values.yaml - Base configuration
replicaCount: 1

image:
  repository: localhost:5000/frontend
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

keycloak:
  url: "http://keycloak.home/auth"
  realm: "purchase-service-realm"
  clientId: "web-frontend-client"

api:
  purchases: "http://api.local.test/purchase-service/purchases"
  inventory: "http://api.local.test/inventory-service/inventory"

# Environment-specific settings
environment: "local" # local, dev, prod
tls:
  enabled: false
  secretName: ""
