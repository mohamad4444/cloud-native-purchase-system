#for reference actual values come from dev.yaml or staging.yaml
globalConfig:
  env: staging
  namespace: staging
  profile: "staging" #used in spring services
  registry: "localhost:5000/"
  pullPolicy: IfNotPresent #takes presedence over image.pullPolicy

replicaCount: 1
image:
  name: "nginx-frontend"
  tag: latest
  pullPolicy: IfNotPresent
config:
  keycloak:
    url: "https://keycloak.local"
    realm: "purchase-service-realm"
    clientId: "web-frontend-client"
    scope: "openid profile email offline_access"
  api:
    purchases: "https://frotnend.local/purchase-api/purchases"
    inventory: "https://frotnend.local/inventory-api/inventory"
ingress:
  enabled: false
