apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{.Values.appName}}-cert
  namespace: {{.Values.namespace}}
spec:
  secretName: {{.Values.appName}}-tls # must match what is in ingress
  issuerRef:
    name: my-ca-issuer   # must match the ClusterIssuer or Issuer
    kind: ClusterIssuer  # or Issuer if namespaced
  commonName: {{.Values.globalConfig.hosts.frontend}} #Certificate host name, must match what is in Ingress
  dnsNames:
  - {{.Values.globalConfig.hosts.frontend}} #certificate dns Names