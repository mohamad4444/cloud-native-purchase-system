apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-cert
  namespace: {{ .Values.globalConfig.namespace }}
spec:
  secretName: {{ .Values.globalConfig.certificates.frontend.secretName }}
  issuerRef:
    name: {{ .Values.globalConfig.caIssuerName }}
    kind: {{ .Values.globalConfig.caIssuerKind }}
  commonName: {{ .Values.globalConfig.certificates.frontend.commonName }}
  dnsNames:
  {{- range .Values.globalConfig.certificates.frontend.dnsNames }}
    - {{ . }}
  {{- end }}