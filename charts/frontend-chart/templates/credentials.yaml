apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frontend-cert
  namespace: {{ .Values.globalConfig.env }}
spec:
  secretName: frontend-tls # must match Ingress
  issuerRef:
    name: my-ca-issuer     # ClusterIssuer or Issuer
    kind: ClusterIssuer
  commonName: frontend.local # must match Ingress host
  dnsNames:
  - frontend.local
