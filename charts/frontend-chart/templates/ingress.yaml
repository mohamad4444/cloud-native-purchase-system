{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: {{.Values.namespace}} #same namespace as tls
  annotations:
    cert-manager.io/cluster-issuer: my-ca-issuer
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://frontend.local"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - frontend.local
    secretName: frontend-tls
  rules:
    - host: frontend.local
      http:
        paths:
          # Inventory API - all paths under /inventory-api
          - path: /inventory-api
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8080
          
          # Purchase API - all paths under /purchase-api
          - path: /purchase-api
            pathType: Prefix
            backend:
              service:
                name: purchase-service
                port:
                  number: 8080
          # Frontend application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{.Values.appName}}-service
                port:
                  number: {{ .Values.frontend.service.port }}
        
{{- end }}