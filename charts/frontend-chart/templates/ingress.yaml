{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace | default "frontend" }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:  {{ include "frontend-chart.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
    - host: {{ .Values.ingress2.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name:  {{ include "frontend-chart.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}