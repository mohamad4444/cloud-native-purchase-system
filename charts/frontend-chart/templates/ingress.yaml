{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.globalConfig.namespace }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.globalConfig.caIssuerName }}
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://{{ .Values.globalConfig.certificates.frontend.commonName }}"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - {{ .Values.globalConfig.certificates.frontend.commonName }}
    secretName: {{ .Values.globalConfig.certificates.frontend.secretName }}
  rules:
    - host: {{ .Values.globalConfig.certificates.frontend.commonName }}
      http:
        paths:
          # Inventory API - all paths under /inventory-api
          - path: /inventory-api
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8080
          
          # Purchase API - all paths under /purchase-api
          - path: /purchase-api
            pathType: Prefix
            backend:
              service:
                name: purchase-service
                port:
                  number: 8080
          # Frontend application
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}