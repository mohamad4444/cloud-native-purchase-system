apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-config
data:
  config.js: |
    // Auto-generated configuration - Do not edit manually
    export const ENVIRONMENT = "{{ .Values.environment }}";
    
    export const KEYCLOAK_CONFIG = {
      url: "{{ .Values.keycloak.url }}",
      realm: "{{ .Values.keycloak.realm }}",
      clientId: "{{ .Values.keycloak.clientId }}",
      scope: "openid profile email offline_access"
    };

    export const API_ENDPOINTS = {
      purchases: "{{ .Values.api.purchases }}",
      inventory: "{{ .Values.api.inventory }}"
    };
    
    // Debug info
    console.log("Frontend configuration loaded for environment:", "{{ .Values.environment }}");