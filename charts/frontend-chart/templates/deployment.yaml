apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
  namespace: {{ .Values.globalConfig.namespace }}
  labels:
    {{- include "lib-helpers.labels" . | nindent 4 }}
  annotations:
    checksum/config: {{ include (printf "%s-config" .Release.Name) . | sha256sum }}    debug/values: {{ .Values | toJson | sha256sum | trunc 8 }}
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "lib-helpers.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "lib-helpers.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-serviceaccount
      containers:
        - name: frontend
          image: "{{ .Values.globalConfig.image-registry }}/{{ .Values.image.name }}:{{ .Values.globalConfig.images.tag }}"
          imagePullPolicy: {{ .Values.globalConfig.image-pullPolicy | quote }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/js/config.js
              subPath: config.js
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config