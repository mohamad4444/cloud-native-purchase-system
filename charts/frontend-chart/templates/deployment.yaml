apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.globalConfig.namespace }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: # must match pod template
      microserviceName: frontend
      component: frontend
      env: {{ .Values.globalConfig.env }}
  template:
    metadata:
      labels:
        microserviceName: frontend
        component: frontend
        env: {{ .Values.globalConfig.env }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.globalConfig.registry}}{{.Values.image.name}}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ default .Values.image.pullPolicy .Values.globalConfig.pullPolicy }}
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/js/config.js
              subPath: config.js 
      volumes:
        - name: config
          configMap:
            name: frontend-config
